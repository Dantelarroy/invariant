[project]
name = "invariant-data"
version = "0.0.0"
description = "Dataset loaders for Invariant: turn public datasets into one common JSONL format."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
invariant-data = "invariant_data.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
