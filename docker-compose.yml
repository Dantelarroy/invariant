# Local development services for Invariant.
# Start: docker compose up -d   ·   Stop: docker compose down
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: invariant-postgres
    environment:
      POSTGRES_USER: invariant
      POSTGRES_PASSWORD: invariant_local_only
      POSTGRES_DB: invariant
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invariant -d invariant"]
      interval: 5s
      timeout: 3s
      retries: 10

  # EN16931 schematron validator (CEN rules 1.3.16, no XSD). 8081 is FacturaScripts.
  validator:
    image: easybill/en16931-validator:0.7.0
    container_name: invariant-validator
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
